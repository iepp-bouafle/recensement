<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recensement IEPP Bouaflé Centre</title>
<meta name="theme-color" content="#1F5F3F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recensement IEPP">
<style>
  /* Page de lancement : affiche le formulaire Apps Script en plein écran */
  html,body{margin:0;height:100%;background:#1F5F3F;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F5F1}
  #attente{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:24px;background:#1F5F3F;transition:opacity .3s}
  #attente img{width:96px;height:96px;border-radius:18px;background:#fff}
  #attente p{margin:0;font-size:15px;opacity:.9}
  #attente a{display:none;margin-top:6px;background:#E07A1F;color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px}
  .cache{opacity:0;pointer-events:none}
</style>
</head>
<body>
<!-- ▼▼▼ Lien de l'application web (se termine par /exec) ▼▼▼ -->
<script>var LIEN_APPLICATION = "https://script.google.com/macros/s/AKfycbxfcKxEGQ2QG7W7m1pmn8FpP0Q0NH_RiHdJTffUEe99DQNNbdI-8mnslh5weGT1e_2WKg/exec";</script>
<!-- ▲▲▲ ---------------------------------------------- ▲▲▲ -->

<iframe id="app" title="Recensement des élèves immatriculés" allow="clipboard-write"></iframe>
<div id="attente">
  <img src="icon-192.png" alt="Logo de l'IEPP Bouaflé Centre">
  <p>Chargement du recensement…</p>
  <a id="ouvrir" href="#">Ouvrir le formulaire</a>
</div>
<script>
(function(){
  var f=document.getElementById("app"), w=document.getElementById("attente"), b=document.getElementById("ouvrir");
  b.href=LIEN_APPLICATION;
  f.addEventListener("load",function(){ w.classList.add("cache"); });
  f.src=LIEN_APPLICATION;
  // Si le formulaire ne s'affiche pas, proposer de l'ouvrir directement
  setTimeout(function(){ b.style.display="inline-block"; },8000);
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
})();
</script>
</body>
</html>
